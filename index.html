<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VANTA Agent — brofist.io builder (Gemini)</title>
<style>
    :root { --bg: rgba(12,14,18,.94); --gr: #9fe6a0; --bd: #2e4; }
    body { margin: 0; font-family: monospace; background: #222; overflow: hidden; }
    #wrap { display: flex; width: 100vw; height: 100vh; }
    #gamePane { flex: 1; position: relative; }
    #game { width: 100%; height: 100%; border: 0; }
    #side { width: 400px; background: var(--bg); border-left: 1px solid var(--bd); display: flex; flex-direction: column; color: #dfe; }
    #head { padding: 10px 12px; color: var(--gr); font-size: 13px; border-bottom: 1px solid #233; display: flex; justify-content: space-between; align-items: center; }
    #head button { background: none; border: 1px solid var(--bd); color: var(--gr); border-radius: 6px; cursor: pointer; font: 11px monospace; padding: 3px 8px; }
    #log { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 11px; line-height: 1.5; }
    #log .u { color: #cfe8d2; margin-top: 6px; }
    #log .a { color: #8fbf92; }
    #log .e { color: #e6a09f; }
    #log .i { color: #6a8f6f; }
    #in { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #233; }
    #cmd { flex: 1; background: #0a0c10; color: #dfe; border: 1px solid #3a5; border-radius: 6px; padding: 8px; font: 12px monospace; outline: none; }
    #go { background: #143; color: var(--gr); border: 1px solid var(--bd); border-radius: 6px; padding: 0 14px; cursor: pointer; font: 12px monospace; }
    #setup { padding: 12px; }
    #setup input { width: 100%; box-sizing: border-box; background: #0a0c10; color: #dfe; border: 1px solid #3a5; border-radius: 6px; padding: 8px; font: 12px monospace; margin-bottom: 8px; }
    #setup button { width: 100%; background: #143; color: var(--gr); border: 1px solid var(--bd); border-radius: 6px; padding: 8px; cursor: pointer; font: 12px monospace; }
    .warn { color: #e6c07a; font-size: 10px; line-height: 1.5; margin-top: 8px; }
    .ok { color: var(--gr); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrap">
    <div id="gamePane"><iframe id="game" src="https://brofist.io/editor/index.html"></iframe></div>
    <div id="side">
        <div id="head"><span>VANTA Agent · Gemini</span><button id="reload">перезапуск редактора</button></div>
        <div id="setup">
            <input id="key" type="password" placeholder="Gemini API key (AIza…)">
            <button id="save">войти</button>
            <div class="ok" id="extStatus">расширение: проверяю…</div>
            <div class="warn">Ключ берётся бесплатно на aistudio.google.com → «Get API key». Хранится только в твоём браузере, уходит напрямую в Google.</div>
        </div>
        <div id="log"></div>
        <div id="in">
            <input id="cmd" placeholder="построй домик с деревом…">
            <button id="go">▶</button>
        </div>
    </div>
</div>
<script>
(() => {
    const $ = id => document.getElementById(id);
    const logBox = $('log');
    function log(m, cls) {
        const d = document.createElement('div');
        d.className = cls || 'a';
        d.textContent = m;
        logBox.appendChild(d);
        logBox.scrollTop = 1e6;
    }

    let key = localStorage.getItem('vanta_gemini_key') || '';
    const MODEL = 'gemini-2.0-flash';
    if (key) { $('key').value = key; enterMode(); }

    function enterMode() {
        $('setup').style.display = 'none';
        log('ключ на месте. Расширение ставит мост в редактор автоматически — пиши задачу.', 'i');
    }
    $('save').onclick = () => {
        key = $('key').value.trim();
        if (!key.startsWith('AIza')) return log('нужен ключ Google AI Studio (начинается с AIza…)', 'e');
        localStorage.setItem('vanta_gemini_key', key);
        enterMode();
    };
    $('reload').onclick = () => { $('game').src = 'https://brofist.io/editor/index.html'; log('редактор перезагружен — расширение переставит мост само', 'i'); };

    // статус расширения
    window.addEventListener('message', e => { if (e.data && e.data.__vantaExtReady) { extReady = true; $('extStatus').textContent = 'расширение: АКТИВНО ✓'; } });
    setTimeout(() => { if (!extReady) $('extStatus').textContent = 'расширение: не найдено — поставь папку extension/ (chrome://extensions)'; }, 4000);

    // ================= канал к редактору =================
    let rid = 0, extReady = false;
    const pending = new Map();
    function rpc(op, extra) {
        return new Promise((resolve, reject) => {
            const id = ++rid;
            pending.set(id, { resolve, reject });
            // канал 1: мост в консоли; канал 2: расширение. Отвечают одинаково.
            $('game').contentWindow.postMessage(Object.assign({ __vanta: true, rid: id, op }, extra), '*');
            $('game').contentWindow.postMessage(Object.assign({ __vantaExt: true, rid: id, op }, extra), '*');
            setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error('мост не отвечает (расширение? консоль?)')); } }, 5000);
        });
    }
    window.addEventListener('message', e => {
        const d = e.data || {};
        if (!d.__vantaBack) return;
        const p = pending.get(d.rid);
        if (p) { pending.delete(d.rid); p.resolve(d.r); }
    });

    // ================= Gemini =================
    const SYSTEM = `Ты — агент-строитель в редакторе 2D-физики brofist.io. Мир: координаты, экран ~1700x900 при scale 1, объекты — цветные прямоугольники и круги.
Отвечай ТОЛЬКО JSON-массивом из 1-5 действий (без markdown, без пояснений):
[{"op":"spawn","shape":"rect|ball","x":0,"y":0,"w":100,"h":40,"r":24,"color":"0xRRGGBB","mass":0},
 {"op":"delete","idPrefix":"начало-id"},
 {"op":"paint","idPrefix":"...","color":"0x..."},
 {"op":"camera","x":0,"y":0},
 {"op":"done","why":"готово"}]
Стратегия: строй цельно (фундамент→стены→крыша), используй snapshot мира для координат, не ставь объекты в одинаковых точках. mass=1 — падает, mass=0 — висит. Цвет 0xRRGGBB.`;

    async function think(goal, world, history) {
        const contents = [{ role: 'user', parts: [{ text: SYSTEM + '\n\nЗАДАЧА: ' + goal + '\n\nТЕКУЩИЙ МИР: ' + JSON.stringify(world) }] }];
        history.slice(-8).forEach(h => contents.push({ role: h.role === 'assistant' ? 'model' : 'user', parts: [{ text: h.text }] }));
        contents.push({ role: 'user', parts: [{ text: 'Верни следующие 1-5 действий (JSON-массив) или [{"op":"done"}] если всё построено. Критично проверь, не дублируешь ли уже поставленное.' }] });
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + encodeURIComponent(key), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents, generationConfig: { temperature: 0.2, maxOutputTokens: 2000 } })
        });
        const j = await res.json();
        if (j.error) throw new Error(j.error.message);
        const txt = (((j.candidates || [])[0] || {}).content || {}).parts || [];
        return txt.map(p => p.text || '').join('').replace(/```json|```/g, '').trim();
    }
    function parseOps(txt) {
        const m = txt.match(/\[[\s\S]*\]/);
        const ops = JSON.parse(m ? m[0] : txt);
        return Array.isArray(ops) ? ops : [ops];
    }
    function mk(o) { return Object.assign({ x: 0, y: 0, angle: 0, radius: 0, alpha: 1, id: '', collision: true, color: '0x333333', fontSize: '', text: '', make: 3, type: 1 }, o); }

    async function run(goal) {
        if (!key) return log('сначала ключ Gemini', 'e');
        let world;
        try { world = await rpc('snapshot'); }
        catch (e) { return log(e.message, 'e'); }
        const history = [];
        for (let step = 1; step <= 25; step++) {
            log('шаг ' + step + '…', 'i');
            let txt;
            try { txt = await think(goal, world, history); }
            catch (e) { return log('мозг: ' + e.message, 'e'); }
            if (!txt) { log('пустой ответ модели — повтори команду', 'e'); return; }
            history.push({ role: 'assistant', text: txt });
            let ops;
            try { ops = parseOps(txt); }
            catch (e) { log('не-JSON: ' + txt.slice(0, 150), 'e'); return; }
            for (const op of ops) {
                try {
                    if (op.op === 'spawn') {
                        const sh = op.shape === 'ball'
                            ? mk({ width: op.r * 2, height: op.r * 2, radius: op.r, color: op.color || '0x888888' })
                            : mk({ width: op.w || 100, height: op.h || 40, color: op.color || '0x666666' });
                        const r = await rpc('spawn', { spec: { x: op.x, y: op.y, angle: 0, mass: op.mass || 0, id: '', shapes: [sh] } });
                        log('spawn ' + op.shape + ' @' + op.x + ',' + op.y + (r.ok ? ' ✓' : ' ✗'), 'a');
                    }
                    else if (op.op === 'delete') { const r = await rpc('delete', { prefix: op.idPrefix || '' }); log('delete ' + r.deleted, 'a'); }
                    else if (op.op === 'paint') { const r = await rpc('paint', { prefix: op.idPrefix || '', color: op.color }); log('paint ' + r.painted, 'a'); }
                    else if (op.op === 'camera') { await rpc('camera', { x: op.x, y: op.y }); }
                    else if (op.op === 'done') { log('ГОТОВО: ' + (op.why || ''), 'a'); return; }
                } catch (e) { log('руки: ' + e.message, 'e'); }
            }
            world = await rpc('snapshot');
            history.push({ role: 'user', text: 'РЕЗУЛЬТАТ ШАГА: ' + JSON.stringify(world).slice(0, 1500) });
        }
        log('25 шагов исчерпано', 'e');
    }

    $('go').onclick = () => { const v = $('cmd').value.trim(); if (v) { $('cmd').value = ''; log('» ' + v, 'u'); run(v); } };
    $('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

    log('VANTA Agent готов. Ключ Gemini → войти → пиши задачу.', 'i');
})();
</script>
</body>
</html>
